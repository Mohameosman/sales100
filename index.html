<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Sales100 - Daily Sales Performance Platform" />
  <title>Sales100 | Daily Sales Performance</title>
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">S100</div>
        <div><strong>Sales100</strong><span>Sales Performance</span></div>
      </div>
      <nav class="nav" aria-label="التنقل الرئيسي">
        <button class="nav-item active" data-view="dashboard"><span>◫</span>لوحة التحكم</button>
        <button class="nav-item" data-view="sales"><span>↗</span>المبيعات اليومية</button>
        <button class="nav-item" data-view="team"><span>👥</span>فريق المبيعات</button>
        <button class="nav-item" data-view="customers"><span>▦</span>العملاء</button>
        <button class="nav-item" data-view="pipeline"><span>◎</span>مسار الفرص</button>
        <button class="nav-item" data-view="reports"><span>▤</span>التقارير</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span> النظام يعمل محليًا</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <button class="icon-btn mobile-only" id="menuBtn" aria-label="فتح القائمة">☰</button>
          <div><h1 id="pageTitle">لوحة التحكم</h1><p id="pageSubtitle">متابعة الأداء اليومي والشهري للمبيعات</p></div>
        </div>
        <div class="topbar-actions">
          <select id="monthFilter" aria-label="اختيار الشهر"></select>
          <select id="repFilter" aria-label="اختيار المندوب"><option value="all">جميع المندوبين</option></select>
          <button class="btn btn-primary" id="addOpportunityBtn">+ فرصة جديدة</button>
        </div>
      </header>
      <section class="content" id="appView" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="opportunityModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="opportunityForm">
      <div class="modal-header"><div><h2 id="modalTitle">إضافة فرصة بيعية</h2><p>أدخل بيانات الفرصة الجديدة</p></div><button type="button" class="icon-btn" id="closeModal">×</button></div>
      <div class="form-grid">
        <label>اسم العميل<input required name="customer" placeholder="مثال: شركة الأفق" /></label>
        <label>المندوب<select required name="rep" id="modalRep"></select></label>
        <label>قيمة الفرصة<input required name="value" type="number" min="1" value="50000" /></label>
        <label>المرحلة<select required name="stage"><option>Lead</option><option>Qualified</option><option>Proposal</option><option>Negotiation</option></select></label>
        <label>احتمال الإغلاق %<input required name="probability" type="number" min="0" max="100" value="60" /></label>
        <label>تاريخ الإغلاق المتوقع<input required name="closeDate" type="date" /></label>
      </div>
      <div class="modal-actions"><button type="button" class="btn" id="cancelModal">إلغاء</button><button class="btn btn-primary" type="submit">حفظ الفرصة</button></div>
    </form>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./data/mock-data.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
