<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sales100 | منصة أداء المبيعات</title>
<meta name="description" content="Sales100 - منصة تفاعلية لمتابعة أداء المبيعات">
<style>
:root{--navy:#0b1628;--navy2:#111f36;--blue:#335cff;--blue2:#6f86ff;--cyan:#22c5e5;--gold:#e3ad2e;--green:#19a86b;--red:#df5265;--amber:#e59425;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#748094;--line:#e4e9f2;--shadow:0 14px 38px rgba(17,31,54,.09);--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:264px minmax(0,1fr)}
.sidebar{background:linear-gradient(180deg,var(--navy),#08111f);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:12px;align-items:center;padding:0 7px 22px;border-bottom:1px solid rgba(255,255,255,.1)}.brand-logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 12px 26px rgba(51,92,255,.35)}.brand strong{display:block;font-size:19px}.brand small{color:#9daac0;display:block;margin-top:4px}.nav{display:grid;gap:7px;margin-top:22px}.nav button{width:100%;border:0;background:transparent;color:#afbbcd;border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:right;transition:.2s}.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,var(--blue),#4d70ff);transform:translateX(-2px)}.nav .ico{width:22px;text-align:center}.side-card{margin-top:auto;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:14px;padding:14px}.side-card strong{font-size:13px}.side-card p{font-size:11px;line-height:1.7;color:#aeb9ca;margin:7px 0 0}.online{display:inline-block;width:8px;height:8px;background:#24d980;border-radius:50%;margin-left:6px;box-shadow:0 0 0 5px rgba(36,217,128,.1)}
.main{min-width:0}.topbar{min-height:88px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 26px}.title-wrap{display:flex;gap:10px;align-items:center}.topbar h1{font-size:22px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:5px 0 0}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.select,.search,.input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;color:var(--text);outline:none;min-height:42px}.select:focus,.search:focus,.input:focus{border-color:#9bafff;box-shadow:0 0 0 3px rgba(51,92,255,.1)}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 15px;font-weight:750;cursor:pointer;color:var(--text);transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(17,31,54,.08)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.menu-btn{display:none;border:0;background:transparent;font-size:25px;cursor:pointer}.content{padding:24px 26px 34px}.page-note{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:14px}.live{display:inline-flex;align-items:center;gap:6px;background:#eaf9f2;color:#167850;padding:7px 10px;border-radius:999px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpi{padding:18px;position:relative;overflow:hidden;min-height:145px}.kpi:before{content:"";position:absolute;left:-30px;top:-35px;width:105px;height:105px;border-radius:50%;background:linear-gradient(135deg,#edf1ff,#f5f7ff)}.kpi .icon{position:absolute;left:17px;top:17px;width:38px;height:38px;border-radius:11px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-weight:900}.kpi label{display:block;color:var(--muted);font-size:12px;margin-bottom:10px}.kpi .value{font-size:27px;font-weight:900;letter-spacing:-.5px}.kpi .sub{font-size:11px;color:var(--muted);margin-top:9px}.positive{color:var(--green)!important}.negative{color:var(--red)!important}
.grid-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.75fr);gap:14px;margin-top:14px}.card-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.card-head h3{margin:0;font-size:15px}.card-body{padding:18px}.badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850}.badge.blue{background:#edf2ff;color:var(--blue)}.badge.green{background:#e9f8f1;color:#148355}.badge.red{background:#ffedf0;color:#b9384a}.badge.amber{background:#fff4df;color:#99620f}
.chart{height:245px;display:flex;align-items:flex-end;gap:7px;padding:15px 5px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:68%;min-height:3px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,var(--blue2),var(--blue));position:relative;transition:.2s}.bar:hover{filter:brightness(.94);transform:scaleX(1.08)}.chart-labels{display:flex;gap:7px;margin-top:8px;color:var(--muted);font-size:10px}.chart-labels span{flex:1;text-align:center}.insight{border:1px solid var(--line);border-right:4px solid var(--blue);border-radius:12px;padding:13px;margin-bottom:10px;background:#fff}.insight strong{display:block;font-size:12px}.insight p{font-size:11px;color:var(--muted);line-height:1.65;margin:6px 0 0}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}
.table-card{margin-top:14px;overflow:hidden}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}th{background:#f8fafe;color:var(--muted);font-size:11px}.avatar{width:34px;height:34px;border-radius:10px;background:#edf2ff;color:var(--blue);display:inline-grid;place-items:center;font-weight:900;margin-left:8px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.search{min-width:280px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{padding:20px;text-align:center}.metric strong{display:block;font-size:25px}.metric span{color:var(--muted);font-size:11px}.pipeline{display:grid;grid-template-columns:repeat(4,minmax(235px,1fr));gap:12px;overflow:auto;padding-bottom:5px}.stage{background:#eef2f8;border:1px solid #e3e8f1;border-radius:16px;padding:12px;min-height:430px}.stage-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.opp{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:0 7px 18px rgba(17,31,54,.05)}.opp strong{font-size:12px}.opp p{margin:7px 0 0;color:var(--muted);font-size:11px}.empty{color:var(--muted);font-size:11px;text-align:center;margin-top:30px}
.modal-bg{position:fixed;inset:0;background:rgba(7,14,25,.62);z-index:60;display:grid;place-items:center;padding:18px}.modal-bg.hidden{display:none}.modal{width:min(690px,100%);background:#fff;border-radius:20px;padding:21px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;gap:12px}.modal h2{font-size:19px;margin:0}.modal p{color:var(--muted);font-size:11px;margin:6px 0 0}.close{border:0;background:#f2f4f8;width:38px;height:38px;border-radius:10px;font-size:22px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field .input,.field .select{width:100%}.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:17px}.toast{position:fixed;left:24px;bottom:24px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;z-index:70;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-main{grid-template-columns:1fr}.actions .select{max-width:150px}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:0;width:270px;transform:translateX(105%);transition:.25s;box-shadow:-15px 0 45px rgba(0,0,0,.2)}.sidebar.open{transform:none}.menu-btn{display:block}.topbar{padding:13px 15px;align-items:flex-start}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.actions .btn{grid-column:1/-1}.title-wrap{align-items:flex-start}.topbar{flex-wrap:wrap}.content{padding:16px}.kpis{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.search{min-width:100%;width:100%}.page-note{align-items:flex-start;flex-direction:column}.kpi .value{font-size:24px}}
@media print{.sidebar,.topbar,.btn,.toolbar{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-logo">S100</div><div><strong>Sales100</strong><small>Sales Performance Platform</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-view="dashboard"><span class="ico">◫</span>لوحة التحكم</button>
    <button data-view="sales"><span class="ico">↗</span>المبيعات اليومية</button>
    <button data-view="team"><span class="ico">👥</span>فريق المبيعات</button>
    <button data-view="customers"><span class="ico">▦</span>العملاء</button>
    <button data-view="pipeline"><span class="ico">◎</span>مسار الفرص</button>
    <button data-view="reports"><span class="ico">▤</span>التقارير</button>
  </nav>
  <div class="side-card"><strong><span class="online"></span>النظام يعمل</strong><p>نسخة تفاعلية مستقلة، بدون مكتبات خارجية، ومتوافقة مع GitHub Pages.</p></div>
</aside>
<main class="main">
<header class="topbar">
  <div class="title-wrap"><button class="menu-btn" id="menuBtn">☰</button><div><h1 id="title">لوحة التحكم</h1><p id="subtitle">متابعة الأداء اليومي والشهري للمبيعات</p></div></div>
  <div class="actions"><select class="select" id="month"></select><select class="select" id="rep"><option value="all">جميع المندوبين</option></select><button class="btn primary" id="addBtn">+ فرصة جديدة</button></div>
</header>
<section class="content" id="view"></section>
</main>
</div>
<div class="modal-bg hidden" id="modal"><form class="modal" id="form"><div class="modal-head"><div><h2>إضافة فرصة بيعية</h2><p>أدخل بيانات الفرصة وسيتم حفظها في هذا المتصفح.</p></div><button type="button" class="close" id="close">×</button></div><div class="form-grid">
<div class="field"><label>اسم العميل</label><input class="input" name="customer" required placeholder="مثال: شركة الأفق"></div>
<div class="field"><label>المندوب</label><select class="select" name="rep" id="formRep" required></select></div>
<div class="field"><label>قيمة الفرصة</label><input class="input" name="value" type="number" min="1" value="50000" required></div>
<div class="field"><label>المرحلة</label><select class="select" name="stage"><option>Lead</option><option>Qualified</option><option>Proposal</option><option>Negotiation</option></select></div>
<div class="field"><label>احتمال الإغلاق %</label><input class="input" name="probability" type="number" min="0" max="100" value="60" required></div>
<div class="field"><label>تاريخ الإغلاق المتوقع</label><input class="input" name="date" type="date" required></div>
</div><div class="modal-actions"><button class="btn primary">حفظ الفرصة</button><button type="button" class="btn" id="cancel">إلغاء</button></div></form></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:0}).format(Math.round(n))+' ر.س', pct=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:1}).format(n)+'%';
const months=[{id:'2026-07',label:'يوليو 2026',days:27,elapsed:18},{id:'2026-06',label:'يونيو 2026',days:26,elapsed:26}];
const reps=[
{id:'R01',name:'أحمد العتيبي',region:'المنطقة الغربية',target:620000,achieved:511000,customers:12},{id:'R02',name:'محمد الحربي',region:'المنطقة الوسطى',target:590000,achieved:472000,customers:11},{id:'R03',name:'خالد الغامدي',region:'المنطقة الشرقية',target:560000,achieved:431000,customers:10},{id:'R04',name:'سارة القحطاني',region:'المنطقة الغربية',target:525000,achieved:414000,customers:10},{id:'R05',name:'نورة الشهري',region:'المنطقة الوسطى',target:500000,achieved:361000,customers:9},{id:'R06',name:'عبدالله الزهراني',region:'المنطقة الجنوبية',target:470000,achieved:342000,customers:10},{id:'R07',name:'فيصل المطيري',region:'المنطقة الشمالية',target:455000,achieved:306000,customers:9},{id:'R08',name:'ريم الدوسري',region:'المنطقة الشرقية',target:435000,achieved:291000,customers:10},{id:'R09',name:'سلمان العنزي',region:'المنطقة الشمالية',target:420000,achieved:271000,customers:9},{id:'R10',name:'تركي السبيعي',region:'المنطقة الجنوبية',target:405000,achieved:242000,customers:10}];
const daily=[146000,158000,139000,176000,151000,188000,161000,194000,173000,182000,169000,202000,188000,211000,193000,218000,207000,229000,0,0,0,0,0,0,0,0,0];
const customers=Array.from({length:100},(_,i)=>{const r=reps[i%10];const states=['Active','Active','Active','At Risk','Inactive'];return{id:'C'+String(i+1).padStart(3,'0'),name:['شركة الأفق','مجموعة المدار','مصانع الريادة','مؤسسة البنيان','شركة النخبة','حلول الخليج','مجموعة السحاب','شركة التميز','مؤسسة الصفوة','شركة المسار'][i%10]+' '+(Math.floor(i/10)+1),repId:r.id,target:30000+(i%8)*7000,achieved:15000+(i%10)*5300,status:states[i%5],last:'2026-07-'+String(18-(i%14)).padStart(2,'0')}});
const defaults=[{id:'OP1',customer:'شركة الأفق',repId:'R01',value:180000,stage:'Negotiation',probability:85,date:'2026-07-29'},{id:'OP2',customer:'مجموعة المدار',repId:'R04',value:125000,stage:'Proposal',probability:70,date:'2026-08-03'},{id:'OP3',customer:'مصانع الريادة',repId:'R02',value:95000,stage:'Qualified',probability:55,date:'2026-08-08'},{id:'OP4',customer:'مؤسسة البنيان',repId:'R06',value:72000,stage:'Lead',probability:30,date:'2026-08-12'},{id:'OP5',customer:'شركة النخبة',repId:'R03',value:210000,stage:'Negotiation',probability:80,date:'2026-08-02'}];
let state={view:'dashboard',month:'2026-07',rep:'all',opps:JSON.parse(localStorage.getItem('sales100-opps')||'null')||defaults};
const getRep=id=>reps.find(r=>r.id===id), fReps=()=>state.rep==='all'?reps:reps.filter(r=>r.id===state.rep), fOpps=()=>state.rep==='all'?state.opps:state.opps.filter(o=>o.repId===state.rep), fCustomers=()=>state.rep==='all'?customers:customers.filter(c=>c.repId===state.rep);
function totals(){const arr=fReps(),target=arr.reduce((s,r)=>s+r.target,0),achieved=arr.reduce((s,r)=>s+r.achieved,0),m=months.find(x=>x.id===state.month),run=achieved/Math.max(1,m.elapsed),forecast=run*m.days;return{target,achieved,gap:Math.max(0,target-achieved),achievement:achieved/target*100,run,forecast,m}}
function kpis(){const t=totals();return`<div class="kpis"><article class="card kpi"><div class="icon">◎</div><label>المستهدف الشهري</label><div class="value">${money(t.target)}</div><div class="sub">${t.m.days} يوم عمل</div></article><article class="card kpi"><div class="icon">↗</div><label>المحقق حتى اليوم</label><div class="value">${money(t.achieved)}</div><div class="sub positive">${pct(t.achievement)} من المستهدف</div></article><article class="card kpi"><div class="icon">△</div><label>الفجوة المتبقية</label><div class="value">${money(t.gap)}</div><div class="sub negative">تحتاج متابعة يومية</div></article><article class="card kpi"><div class="icon">≈</div><label>التوقع لنهاية الشهر</label><div class="value">${money(t.forecast)}</div><div class="sub ${t.forecast>=t.target?'positive':'negative'}">${t.forecast>=t.target?'أعلى من المستهدف':'أقل من المستهدف'}</div></article></div>`}
function chart(){const max=Math.max(...daily,1);return`<div class="chart">${daily.map((v,i)=>`<div class="bar-wrap" title="اليوم ${i+1}: ${money(v)}"><div class="bar" style="height:${v?Math.max(4,v/max*100):2}%"></div></div>`).join('')}</div><div class="chart-labels">${daily.map((_,i)=>`<span>${i%3===0?i+1:''}</span>`).join('')}</div>`}
function dashboard(){const t=totals(),rank=fReps().slice().sort((a,b)=>b.achieved/b.target-a.achieved/a.target),need=Math.max(0,t.gap/Math.max(1,t.m.days-t.m.elapsed));return`<div class="page-note"><span class="live"><span class="online"></span>بيانات مباشرة</span><span>${state.rep==='all'?'عرض أداء الفريق بالكامل':getRep(state.rep).name}</span></div>${kpis()}<div class="grid-main"><article class="card"><div class="card-head"><h3>اتجاه المبيعات اليومية</h3><span class="badge blue">متوسط ${money(t.run)}</span></div><div class="card-body">${chart()}</div></article><article class="card"><div class="card-head"><h3>تنبيهات الإدارة</h3><span class="badge amber">3 توصيات</span></div><div class="card-body"><div class="insight"><strong>المعدل اليومي المطلوب</strong><p>يلزم تحقيق ${money(need)} يوميًا حتى نهاية الشهر.</p></div><div class="insight"><strong>أفضل أداء حاليًا</strong><p>${rank[0]?.name||'-'} بنسبة إنجاز ${pct(rank[0]?.achieved/rank[0]?.target*100||0)}.</p></div><div class="insight"><strong>فرص قريبة من الإغلاق</strong><p>${fOpps().filter(o=>o.probability>=70).length} فرص باحتمال 70% أو أكثر.</p></div></div></article></div><article class="card table-card"><div class="card-head"><h3>ترتيب فريق المبيعات</h3><button class="btn" data-go="team">عرض التفاصيل</button></div><div class="table-wrap"><table><thead><tr><th>#</th><th>المندوب</th><th>المنطقة</th><th>المستهدف</th><th>المحقق</th><th>الإنجاز</th><th>الفجوة</th></tr></thead><tbody>${rank.map((r,i)=>`<tr><td>${i+1}</td><td><span class="avatar">${r.name[0]}</span><strong>${r.name}</strong></td><td>${r.region}</td><td>${money(r.target)}</td><td>${money(r.achieved)}</td><td><span class="badge ${r.achieved/r.target>=.8?'green':r.achieved/r.target>=.67?'amber':'red'}">${pct(r.achieved/r.target*100)}</span></td><td>${money(Math.max(0,r.target-r.achieved))}</td></tr>`).join('')}</tbody></table></div></article>`}
function sales(){const t=totals(),dTarget=t.target/t.m.days;return`${kpis()}<article class="card table-card"><div class="card-head"><h3>سجل المبيعات اليومية</h3><span class="badge blue">${t.m.label}</span></div><div class="table-wrap"><table><thead><tr><th>اليوم</th><th>المبيعات</th><th>المستهدف اليومي</th><th>الفرق</th><th>الحالة</th></tr></thead><tbody>${daily.map((v,i)=>{const d=v-dTarget;return`<tr><td>${i+1}</td><td>${money(v)}</td><td>${money(dTarget)}</td><td class="${d>=0?'positive':'negative'}">${money(d)}</td><td><span class="badge ${v===0?'blue':d>=0?'green':'red'}">${v===0?'قادم':d>=0?'محقق':'أقل من المطلوب'}</span></td></tr>`}).join('')}</tbody></table></div></article>`}
function team(){const t=totals();return`<div class="metric-row"><article class="card metric"><strong>${fReps().length}</strong><span>عدد المندوبين</span></article><article class="card metric"><strong>${money(t.achieved)}</strong><span>إجمالي المحقق</span></article><article class="card metric"><strong>${pct(t.achievement)}</strong><span>نسبة الإنجاز</span></article></div><article class="card table-card"><div class="card-head"><h3>تفاصيل أداء المندوبين</h3></div><div class="table-wrap"><table><thead><tr><th>المندوب</th><th>المنطقة</th><th>العملاء</th><th>المستهدف</th><th>المحقق</th><th>التقدم</th></tr></thead><tbody>${fReps().map(r=>`<tr><td><span class="avatar">${r.name[0]}</span><strong>${r.name}</strong></td><td>${r.region}</td><td>${r.customers}</td><td>${money(r.target)}</td><td>${money(r.achieved)}</td><td style="min-width:170px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>${pct(r.achieved/r.target*100)}</span></div><div class="progress"><i style="width:${Math.min(100,r.achieved/r.target*100)}%"></i></div></td></tr>`).join('')}</tbody></table></div></article>`}
function customersView(){return`<div class="toolbar"><input class="search" id="search" placeholder="ابحث باسم العميل أو الرقم"><span class="badge blue">${fCustomers().length} عميل</span></div><article class="card"><div class="table-wrap"><table><thead><tr><th>الرقم</th><th>العميل</th><th>المندوب</th><th>المستهدف</th><th>المحقق</th><th>آخر طلب</th><th>الحالة</th></tr></thead><tbody id="rows">${fCustomers().map(c=>`<tr><td>${c.id}</td><td><strong>${c.name}</strong></td><td>${getRep(c.repId).name}</td><td>${money(c.target)}</td><td>${money(c.achieved)}</td><td>${c.last}</td><td><span class="badge ${c.status==='Active'?'green':c.status==='At Risk'?'red':'amber'}">${c.status}</span></td></tr>`).join('')}</tbody></table></div></article>`}
function pipeline(){const stages=['Lead','Qualified','Proposal','Negotiation'];return`<div class="toolbar"><span>إجمالي قيمة الفرص: <strong>${money(fOpps().reduce((s,o)=>s+o.value,0))}</strong></span><button class="btn primary" id="inlineAdd">+ فرصة جديدة</button></div><div class="pipeline">${stages.map(s=>{const a=fOpps().filter(o=>o.stage===s);return`<section class="stage"><div class="stage-head"><strong>${s}</strong><span class="badge blue">${a.length}</span></div>${a.map(o=>`<article class="opp"><strong>${o.customer}</strong><p>${getRep(o.repId)?.name||'-'}</p><p>${money(o.value)} • احتمال ${o.probability}%</p><p>الإغلاق: ${o.date}</p></article>`).join('')||'<div class="empty">لا توجد فرص</div>'}</section>`}).join('')}</div>`}
function reports(){const t=totals(),weighted=fOpps().reduce((s,o)=>s+o.value*o.probability/100,0),risk=fCustomers().filter(c=>c.status==='At Risk').length;return`<div class="metric-row"><article class="card metric"><strong>${money(weighted)}</strong><span>قيمة الفرص المرجحة</span></article><article class="card metric"><strong>${risk}</strong><span>عملاء معرضون للخطر</span></article><article class="card metric"><strong class="${t.forecast>=t.target?'positive':'negative'}">${money(t.forecast-t.target)}</strong><span>انحراف التوقع</span></article></div><article class="card table-card"><div class="card-head"><h3>الملخص التنفيذي</h3><button class="btn" id="print">طباعة التقرير</button></div><div class="card-body"><div class="insight"><strong>الإنجاز الكلي</strong><p>تم تحقيق ${pct(t.achievement)} من المستهدف الشهري.</p></div><div class="insight"><strong>التوقع لنهاية الشهر</strong><p>التوقع الحالي يبلغ ${money(t.forecast)}.</p></div><div class="insight"><strong>المخاطر</strong><p>${fCustomers().filter(c=>c.status!=='Active').length} عميل يحتاج متابعة.</p></div></div></article>`}
const views={dashboard,sales,team,customers:customersView,pipeline,reports};const meta={dashboard:['لوحة التحكم','متابعة الأداء اليومي والشهري للمبيعات'],sales:['المبيعات اليومية','تحليل الأداء مقابل المستهدف اليومي'],team:['فريق المبيعات','ترتيب ومقارنة أداء المندوبين'],customers:['العملاء','متابعة قاعدة العملاء وحالتهم البيعية'],pipeline:['مسار الفرص','إدارة الفرص حسب المرحلة واحتمال الإغلاق'],reports:['التقارير التنفيذية','مؤشرات وملخصات للإدارة العليا']};
function render(){ $('#title').textContent=meta[state.view][0];$('#subtitle').textContent=meta[state.view][1];$('#view').innerHTML=views[state.view]();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));if($('#search'))$('#search').oninput=e=>document.querySelectorAll('#rows tr').forEach(r=>r.hidden=!r.innerText.includes(e.target.value));if($('#inlineAdd'))$('#inlineAdd').onclick=open;if($('#print'))$('#print').onclick=()=>window.print()}
function setView(v){state.view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#sidebar').classList.remove('open');render()}
function open(){$('#modal').classList.remove('hidden')}function close(){$('#modal').classList.add('hidden')}function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
months.forEach(m=>$('#month').insertAdjacentHTML('beforeend',`<option value="${m.id}">${m.label}</option>`));reps.forEach(r=>{$('#rep').insertAdjacentHTML('beforeend',`<option value="${r.id}">${r.name}</option>`);$('#formRep').insertAdjacentHTML('beforeend',`<option value="${r.id}">${r.name}</option>`)});document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#month').onchange=e=>{state.month=e.target.value;render()};$('#rep').onchange=e=>{state.rep=e.target.value;render()};$('#addBtn').onclick=open;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#close').onclick=close;$('#cancel').onclick=close;$('#modal').onclick=e=>{if(e.target.id==='modal')close()};$('#form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);state.opps.unshift({id:'OP'+Date.now(),customer:f.get('customer').trim(),repId:f.get('rep'),value:Number(f.get('value')),stage:f.get('stage'),probability:Number(f.get('probability')),date:f.get('date')});localStorage.setItem('sales100-opps',JSON.stringify(state.opps));close();e.currentTarget.reset();notify('تمت إضافة الفرصة بنجاح');if(state.view==='pipeline')render()};render();
})();
</script>
</body></html>
